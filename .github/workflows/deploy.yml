name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jhb-0212/nepenthe/web

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nepenthe
          POSTGRES_PASSWORD: nepenthe
          POSTGRES_DB: nepenthe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nepenthe" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        working-directory: .
        run: npm ci

      - name: 建表并灌种子（验证迁移可执行）
        working-directory: .
        env:
          DATABASE_URL: postgresql://nepenthe:nepenthe@127.0.0.1:5432/nepenthe_test?schema=public
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: 类型检查与构建
        working-directory: .
        env:
          DATABASE_URL: postgresql://nepenthe:nepenthe@127.0.0.1:5432/nepenthe_test?schema=public
          SECRET_KEY: ci-secret-key-32-bytes-long-xxxxx
        run: npm run build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 服务器拉取、迁移、滚动重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/nepenthe
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export WEB_IMAGE=${{ env.IMAGE }}:latest
            docker compose pull web
            docker compose run --rm migrate
            docker compose up -d --no-deps web
            docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1:3100/api/health || (docker compose logs --tail=80 web && exit 1)
