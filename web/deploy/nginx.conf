# 忘忧居 · nginx 反代
# 要点：
#   1. 静态资源（/_next/static）长缓存，一年不可变
#   2. SSE（/api/stream、/api/publish/stream）关闭缓冲，否则进度不会实时到
#   3. 404 保持真 404，不写成 200
#   4. 真实 IP 只在可信反代层落，埋点才不会全塌成 1

upstream nepenthe_web {
    server web:3100;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hit_zone:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;
    server_tokens off;

    # 静态资源：内容哈希命名，直接长缓存
    location /_next/static/ {
        proxy_pass http://nepenthe_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SSE：必须 no-buffer + 长超时
    location /api/stream {
        proxy_pass http://nepenthe_web;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /api/publish/stream {
        proxy_pass http://nepenthe_web;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 埋点：单独限流，别让它打满接口
    location = /api/hit {
        limit_req zone=hit_zone burst=20 nodelay;
        proxy_pass http://nepenthe_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://nepenthe_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nepenthe_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
